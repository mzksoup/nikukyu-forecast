name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同じブランチへ続けてpushしたときは古い実行を打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # package.json の test は node --test にglobを渡すため Node 21 以上が必要
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # テスト自体は依存パッケージなしで動く
      - run: npm test

      # styles.css が最新か確かめる。クラス名を変えて作り直しを忘れると、ここで失敗する
      - run: npm ci
      - run: npm run build:css
      - run: git diff --exit-code styles.css
